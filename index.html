<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cooperativa - Viagens Compartilhadas</title>
  
  <!-- Google Material Symbols (Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            uber: {
              black: '#000000',
              white: '#ffffff',
              gray: '#f6f6f6',
              'gray-hover': '#eeeeee',
              charcoal: '#333333',
              iron: '#767676',
              slate: '#a6a6a6',
              border: '#e5e7eb',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS for Animations, Touch and Material Icons -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-white text-uber-black font-sans antialiased min-h-screen flex flex-col selection:bg-black selection:text-white">

  <!-- Top Navigation Header -->
  <header id="header-root" class="bg-uber-black text-white sticky top-0 z-40 border-b border-uber-charcoal"></header>

  <!-- Main Dynamic SPA Page Content -->
  <main id="app-root" class="flex-1 w-full pb-28 md:pb-12 min-h-[calc(100vh-4rem)]"></main>

  <!-- Desktop Footer -->
  <footer id="footer-root" class="hidden md:block bg-uber-black text-white border-t border-uber-charcoal mt-16 pb-12 pt-10"></footer>

  <!-- Mobile Bottom Navigation Bar with Safe Area Support -->
  <nav id="mobile-nav-root" aria-label="Navegação inferior móvel" class="md:hidden fixed bottom-3 left-4 right-4 z-40 mobile-nav-container pointer-events-auto"></nav>

  <!-- Modals Root -->
  <div id="modal-root" class="relative z-50"></div>

  <!-- Toast Root -->
  <aside id="toast-root" aria-label="Notificações do sistema" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-50 flex flex-col gap-2 pointer-events-none"></aside>

  <!-- Application Logic (Vanilla JS) -->
  <script src="app.js"></script>
</body>
</html>
