<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradSedan" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="85%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#88c5f7" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#203a4f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1b26" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lightWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lightRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="160" cy="138" rx="135" ry="12" fill="url(#shadowGrad)"/>

  <!-- Rear Left Wheel (Background) -->
  <ellipse cx="68" cy="116" rx="14" ry="17" fill="#111111"/>

  <!-- Car Body Main Hull (Sedan) -->
  <path d="M 22 108 
           C 24 96, 38 88, 55 86 
           L 95 82 
           C 120 54, 155 42, 210 42 
           C 238 42, 260 52, 275 74 
           L 292 82 
           C 305 87, 312 95, 308 108 
           C 305 116, 290 120, 272 120 
           L 262 120 
           C 256 106, 240 96, 222 96 
           C 204 96, 188 106, 182 120 
           L 112 120 
           C 106 106, 90 96, 72 96 
           C 54 96, 38 106, 32 120 
           L 24 120 
           C 20 118, 19 113, 22 108 Z" 
        fill="url(#bodyGradSedan)"/>

  <!-- Roof & Cabin Surface -->
  <path d="M 102 81 
           C 125 56, 158 45, 208 45 
           C 234 45, 254 54, 268 74 
           L 218 75 
           L 142 77 Z" 
        fill="url(#roofGrad)"/>

  <!-- Greenhouse Glass (Windows) -->
  <!-- Rear Window -->
  <path d="M 106 80 L 138 58 L 152 77 L 110 79 Z" fill="url(#glassGrad)"/>
  <!-- Middle Window -->
  <path d="M 143 56 L 195 50 L 193 76 L 156 77 Z" fill="url(#glassGrad)"/>
  <!-- Front Windshield -->
  <path d="M 200 50 C 224 50, 242 56, 258 72 L 198 75 Z" fill="url(#glassGrad)"/>

  <!-- Window Pillars (Chrome/Matte B-pillar) -->
  <line x1="154" y1="55" x2="154" y2="77" stroke="#111827" stroke-width="3"/>
  <line x1="196" y1="50" x2="195" y2="76" stroke="#111827" stroke-width="3"/>

  <!-- Body Dynamic Character Lines -->
  <path d="M 35 94 Q 160 88 288 90" stroke="#4b5563" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 40 106 Q 160 102 278 105" stroke="#374151" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 102 81 L 210 81" stroke="#ffffff" stroke-width="0.75" fill="none" opacity="0.3"/>

  <!-- Front Headlight (LED Crisp Glow) -->
  <polygon points="282,85 304,91 298,99 278,94" fill="url(#lightWhite)"/>
  <polygon points="288,88 302,92 296,96 284,93" fill="#ffffff"/>

  <!-- Rear Taillight -->
  <path d="M 23 100 C 21 95, 26 92, 34 91 L 38 98 L 24 103 Z" fill="url(#lightRed)"/>

  <!-- Front Wheel Arch -->
  <path d="M 252 120 C 252 103, 238 90, 222 90 C 206 90, 192 103, 192 120 Z" fill="#09090b"/>

  <!-- Front Wheel (Tire) -->
  <ellipse cx="222" cy="118" rx="24" ry="24" fill="url(#wheelGrad)"/>
  <!-- Front Wheel Rim -->
  <ellipse cx="222" cy="118" rx="15" ry="15" fill="url(#rimGrad)"/>
  <ellipse cx="222" cy="118" rx="12" ry="12" fill="#18181b"/>
  <!-- Spokes -->
  <line x1="222" y1="106" x2="222" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="210" y1="118" x2="234" y2="118" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="213" y1="109" x2="231" y2="127" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="213" y1="127" x2="231" y2="109" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="222" cy="118" r="4" fill="#f8fafc"/>

  <!-- Rear Wheel Arch -->
  <path d="M 102 120 C 102 103, 88 90, 72 90 C 56 90, 42 103, 42 120 Z" fill="#09090b"/>

  <!-- Rear Wheel (Tire) -->
  <ellipse cx="72" cy="118" rx="24" ry="24" fill="url(#wheelGrad)"/>
  <!-- Rear Wheel Rim -->
  <ellipse cx="72" cy="118" rx="15" ry="15" fill="url(#rimGrad)"/>
  <ellipse cx="72" cy="118" rx="12" ry="12" fill="#18181b"/>
  <!-- Spokes -->
  <line x1="72" y1="106" x2="72" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="118" x2="84" y2="118" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="63" y1="109" x2="81" y2="127" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="63" y1="127" x2="81" y2="109" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="72" cy="118" r="4" fill="#f8fafc"/>

  <!-- Side Mirror -->
  <path d="M 215 72 C 220 71, 226 73, 226 77 L 214 78 Z" fill="#262626"/>
  
  <!-- Door Handles -->
  <rect x="135" y="87" width="12" height="2.5" rx="1" fill="#404040"/>
  <rect x="185" y="87" width="12" height="2.5" rx="1" fill="#404040"/>
</svg>
