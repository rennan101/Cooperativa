<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowGradHatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradHatch" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="45%" stop-color="#171717"/>
      <stop offset="85%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="glassGradHatch" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#1e3a8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wheelGradHatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="rimGradHatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="160" cy="138" rx="130" ry="12" fill="url(#shadowGradHatch)"/>

  <!-- Rear Left Wheel (Background) -->
  <ellipse cx="70" cy="116" rx="14" ry="17" fill="#111111"/>

  <!-- Car Body Main Hull (Hatchback - Steep rear, compact front) -->
  <path d="M 38 108 
           C 36 94, 48 80, 68 76 
           L 115 50 
           C 145 44, 185 44, 218 45 
           C 244 46, 264 56, 276 74 
           L 290 82 
           C 304 88, 308 97, 304 108 
           C 300 116, 288 120, 270 120 
           L 260 120 
           C 254 106, 238 96, 220 96 
           C 202 96, 186 106, 180 120 
           L 112 120 
           C 106 106, 90 96, 72 96 
           C 54 96, 38 106, 32 120 
           L 30 120 
           C 28 116, 32 112, 38 108 Z" 
        fill="url(#bodyGradHatch)"/>

  <!-- Greenhouse Glass (Windows) -->
  <!-- Hatchback Rear Quarter Glass -->
  <path d="M 72 75 L 112 55 L 136 53 L 138 75 Z" fill="url(#glassGradHatch)"/>
  <!-- Middle Window -->
  <path d="M 142 53 L 196 48 L 194 75 L 142 75 Z" fill="url(#glassGradHatch)"/>
  <!-- Front Windshield -->
  <path d="M 200 48 C 224 49, 244 56, 258 72 L 198 75 Z" fill="url(#glassGradHatch)"/>

  <!-- Pillars -->
  <line x1="140" y1="53" x2="140" y2="75" stroke="#111827" stroke-width="3"/>
  <line x1="196" y1="48" x2="195" y2="75" stroke="#111827" stroke-width="3"/>

  <!-- Character lines -->
  <path d="M 45 92 Q 160 86 284 88" stroke="#4b5563" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 50 106 Q 160 103 276 105" stroke="#374151" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Front Headlight -->
  <polygon points="280,84 302,90 296,98 276,93" fill="#60a5fa"/>
  <polygon points="286,87 300,91 294,95 282,92" fill="#ffffff"/>

  <!-- Rear Taillight -->
  <path d="M 38 96 C 36 90, 42 86, 50 85 L 54 94 L 40 98 Z" fill="#ef4444"/>

  <!-- Rear Spoiler -->
  <path d="M 64 74 C 55 76, 50 78, 48 81 L 52 82 C 58 79, 66 77, 72 76 Z" fill="#18181b"/>

  <!-- Front Wheel Arch & Wheel -->
  <path d="M 250 120 C 250 103, 236 90, 220 90 C 204 90, 190 103, 190 120 Z" fill="#09090b"/>
  <ellipse cx="220" cy="118" rx="24" ry="24" fill="url(#wheelGradHatch)"/>
  <ellipse cx="220" cy="118" rx="15" ry="15" fill="url(#rimGradHatch)"/>
  <ellipse cx="220" cy="118" rx="12" ry="12" fill="#18181b"/>
  <circle cx="220" cy="118" r="4" fill="#ffffff"/>
  <line x1="220" y1="106" x2="220" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="208" y1="118" x2="232" y2="118" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Rear Wheel Arch & Wheel -->
  <path d="M 102 120 C 102 103, 88 90, 72 90 C 56 90, 42 103, 42 120 Z" fill="#09090b"/>
  <ellipse cx="72" cy="118" rx="24" ry="24" fill="url(#wheelGradHatch)"/>
  <ellipse cx="72" cy="118" rx="15" ry="15" fill="url(#rimGradHatch)"/>
  <ellipse cx="72" cy="118" rx="12" ry="12" fill="#18181b"/>
  <circle cx="72" cy="118" r="4" fill="#ffffff"/>
  <line x1="72" y1="106" x2="72" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="118" x2="84" y2="118" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Mirror & Handles -->
  <path d="M 212 70 C 218 69, 224 71, 224 75 L 212 76 Z" fill="#262626"/>
  <rect x="130" y="85" width="12" height="2.5" rx="1" fill="#404040"/>
  <rect x="180" y="85" width="12" height="2.5" rx="1" fill="#404040"/>
</svg>
